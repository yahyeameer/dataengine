# Hermes on a Hostinger VPS.
#
#   docker compose up -d --build     start, and start again on every reboot
#   docker compose logs -f           watch it work
#   docker compose restart           pick up a changed .env
#   docker compose down              stop
#
# One service. The database is hosted Supabase, so there is nothing else to run
# here and nothing to back up on this box -- the VPS holds no state, which is
# what makes "rebuild it from scratch" a five-minute operation rather than a
# recovery plan.

services:
  hermes:
    build: .
    # `unless-stopped` rather than `always`: it survives reboots and crashes,
    # but a deliberate `docker compose stop` stays stopped instead of coming
    # back the next time the machine boots.
    restart: unless-stopped
    env_file: .env

    environment:
      # polars, duckdb and pyarrow each size their thread pool from the host's
      # core count, not from this container's CPU quota -- so on an unrestricted
      # box a single workbook parse fans out across every core and holds them
      # until it finishes. That is exactly the sustained load Hostinger throttles
      # as "potentially compromised", and the throttle is 25% per hour.
      #
      # The `cpus` limit below is what actually caps consumption; these two keep
      # the library from oversubscribing the quota it has been given, which turns
      # contention into throughput.
      POLARS_MAX_THREADS: ${HERMES_THREADS:-1}
      OMP_NUM_THREADS: ${HERMES_THREADS:-1}

    volumes:
      # Scratch space for parsing. Named rather than bind-mounted so it is not
      # affected by the host's permissions, and so `docker compose down -v`
      # cleans it up.
      - hermes-work:/var/lib/hermes

    networks:
      # The Hermes agent's network, so the worker can reach its API server for
      # the reasoning calls. Declared here rather than attached by hand after
      # the fact, because the failure mode of forgetting is silent: the worker
      # starts, claims, parses and succeeds, and every explanation quietly
      # comes from the rule engine instead of the model. Nothing errors, no job
      # fails, and the only symptom is plainer prose that looks like a working
      # system. A reboot must not be able to cause that.
      - hermes

    # A single 1 GB VPS is the target. The parser holds a workbook in memory
    # while it reads it, so the cap is set above the 50 MB upload limit with
    # room for Arrow's buffers -- and set at all so that one pathological file
    # cannot take the whole box down with it.
    deploy:
      resources:
        limits:
          memory: 768M
          # A third of ONE core, because the documented target box has exactly
          # one (`nproc` on srv1927440 prints 1) and already runs a reverse
          # proxy and an agent on it.
          #
          # Parsing is bursty and nobody watches it happen, so a job that takes
          # three times as long costs nothing -- while an hour of throttled CPU
          # costs everything on the box at once, including the agent that has
          # nothing to do with this queue. On a single core the cap is not
          # tuning, it is the only thing standing between one workbook and a
          # host-level throttle.
          #
          # Raise it with `nproc`, not by feel: HERMES_CPUS in .env.
          cpus: "${HERMES_CPUS:-0.35}"

    logging:
      driver: json-file
      options:
        # Without this the log grows until the disk is full, which on a small
        # VPS happens quietly and then all at once.
        max-size: "10m"
        max-file: "5"

    security_opt:
      - no-new-privileges:true

volumes:
  hermes-work:

networks:
  # External: the agent's gateway owns this network, not us. Named through a
  # variable because the agent's compose project name is not ours to depend on.
  hermes:
    external: true
    name: ${HERMES_NETWORK:-hermes-agent-bwlq_default}
