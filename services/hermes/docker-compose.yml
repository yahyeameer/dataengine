# Hermes on a Hostinger VPS.
#
#   docker compose up -d --build     start, and start again on every reboot
#   docker compose logs -f           watch it work
#   docker compose restart           pick up a changed .env
#   docker compose down              stop
#
# One service. The database is hosted Supabase, so there is nothing else to run
# here and nothing to back up on this box -- the VPS holds no state, which is
# what makes "rebuild it from scratch" a five-minute operation rather than a
# recovery plan.

services:
  hermes:
    build: .
    # `unless-stopped` rather than `always`: it survives reboots and crashes,
    # but a deliberate `docker compose stop` stays stopped instead of coming
    # back the next time the machine boots.
    restart: unless-stopped
    env_file: .env

    environment:
      # polars, duckdb and pyarrow each size their thread pool from the host's
      # core count, not from this container's CPU quota -- so on an unrestricted
      # box a single workbook parse fans out across every core and holds them
      # until it finishes. That is exactly the sustained load Hostinger throttles
      # as "potentially compromised", and the throttle is 25% per hour.
      #
      # The `cpus` limit below is what actually caps consumption; these two keep
      # the library from oversubscribing the quota it has been given, which turns
      # contention into throughput.
      POLARS_MAX_THREADS: ${HERMES_THREADS:-1}
      OMP_NUM_THREADS: ${HERMES_THREADS:-1}

      # The Kanban board lives inside the agent's container, so the bridge runs
      # the CLI there over the exec API -- through the proxy below, never
      # against the socket directly. Unset in .env, none of this is reachable
      # and the bridge is simply off.
      HERMES_KANBAN_DOCKER_HOST: ${HERMES_KANBAN_DOCKER_HOST:-}
      HERMES_KANBAN_CONTAINER: ${HERMES_KANBAN_CONTAINER:-}

    volumes:
      # Scratch space for parsing. Named rather than bind-mounted so it is not
      # affected by the host's permissions, and so `docker compose down -v`
      # cleans it up.
      - hermes-work:/var/lib/hermes

    networks:
      # Two networks, and the split is the point. `hermes` reaches the agent's
      # API server for the reasoning calls; `kanban-exec` reaches the socket
      # proxy and nothing else.
      - kanban-exec
      # The Hermes agent's network, so the worker can reach its API server for
      # the reasoning calls. Declared here rather than attached by hand after
      # the fact, because the failure mode of forgetting is silent: the worker
      # starts, claims, parses and succeeds, and every explanation quietly
      # comes from the rule engine instead of the model. Nothing errors, no job
      # fails, and the only symptom is plainer prose that looks like a working
      # system. A reboot must not be able to cause that.
      - hermes

    # A single 1 GB VPS is the target. The parser holds a workbook in memory
    # while it reads it, so the cap is set above the 50 MB upload limit with
    # room for Arrow's buffers -- and set at all so that one pathological file
    # cannot take the whole box down with it.
    deploy:
      resources:
        limits:
          memory: 768M
          # A third of ONE core, because the documented target box has exactly
          # one (`nproc` on srv1927440 prints 1) and already runs a reverse
          # proxy and an agent on it.
          #
          # Parsing is bursty and nobody watches it happen, so a job that takes
          # three times as long costs nothing -- while an hour of throttled CPU
          # costs everything on the box at once, including the agent that has
          # nothing to do with this queue. On a single core the cap is not
          # tuning, it is the only thing standing between one workbook and a
          # host-level throttle.
          #
          # Raise it with `nproc`, not by feel: HERMES_CPUS in .env.
          cpus: "${HERMES_CPUS:-0.35}"

    logging:
      driver: json-file
      options:
        # Without this the log grows until the disk is full, which on a small
        # VPS happens quietly and then all at once.
        max-size: "10m"
        max-file: "5"

    security_opt:
      - no-new-privileges:true

  # The narrow way to run one command inside the agent's container.
  #
  # The worker needs to run `hermes kanban ...`, and that CLI lives in the
  # agent's container with the board's SQLite file. The obvious way to reach it
  # -- mount /var/run/docker.sock into the worker and shell out -- hands root on
  # the host to a process that already holds the Supabase service key. One
  # compromise would then be the host *and* every tenant's data, and that is not
  # a trade worth making for a report.
  #
  # This was first attempted with `tecnativa/docker-socket-proxy` and
  # CONTAINERS=1, EXEC=1, POST=1. That was not narrower than mounting the
  # socket: its container ACL is a single prefix match on /containers, so
  # CONTAINERS=1 also permits `POST /containers/create`. Verified against the
  # running proxy -- a create with a nonsense image returned `404 No such image`
  # from the daemon rather than `403` from the proxy, and a real image with
  # Privileged plus a bind of `/` would have been root on the host.
  #
  # So the allowlist is written out by hand in
  # deploy/kanban-exec-proxy.conf.template, deny-by-default, with the agent's
  # container name baked into the one rule that names a container. What the
  # worker can do is: run a command in that container and read the result.
  #
  # Worth saying plainly rather than filing under "secured": that is still
  # enough to read the agent container's secrets. Narrower than root on the
  # host, not harmless.
  kanban-socket-proxy:
    build:
      context: .
      dockerfile: deploy/exec-proxy.Dockerfile
      args:
        # `stat -c %g /var/run/docker.sock` on the host. See the Dockerfile for
        # why this cannot be `group_add` alone.
        DOCKER_GID: ${DOCKER_GID:-988}
    restart: unless-stopped
    environment:
      # Substituted into the config template at start-up by the nginx image's
      # own entrypoint. Changing which container the bridge may reach is a
      # redeploy, not a request parameter.
      KANBAN_AGENT_CONTAINER: ${HERMES_KANBAN_CONTAINER:-hermes-agent-bwlq-hermes-agent-1}
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx/conf.d
    volumes:
      - ./deploy/kanban-exec-proxy.conf.template:/etc/nginx/templates/default.conf.template:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # No group_add: it reaches the container's initial process, and nginx drops
    # its workers to the `nginx` user, which takes its groups from /etc/group
    # inside the image. The Dockerfile puts `nginx` in the socket's group, which
    # is the only privilege this container needs and the only one it gets.
    networks:
      - kanban-exec
    # No ports. Reachable only from the worker, over an internal network.
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.05"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  hermes-work:

networks:
  # External: the agent's gateway owns this network, not us. Named through a
  # variable because the agent's compose project name is not ours to depend on.
  hermes:
    external: true
    name: ${HERMES_NETWORK:-hermes-agent-bwlq_default}

  # Ours, and deliberately `internal`: the proxy holds a handle on the Docker
  # socket, so it should not be able to reach anything off this box even if
  # something inside it were to try.
  kanban-exec:
    driver: bridge
    internal: true
